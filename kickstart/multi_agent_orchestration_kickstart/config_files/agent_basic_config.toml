#################################################################
# Config for A2A Basic Agent embedding MCP Runtime
#################################################################

#################################################################
# General parameters
#################################################################
agent_id="Basic_Agent"
agent_name="Basic_Agent"
agent_http_endpoint="http://127.0.0.1:8080"
agent_ws_endpoint="ws://127.0.0.1:8081"

#################################################################
# Discovery & Memory Services
#################################################################
agent_discovery_url="http://127.0.0.1:4000"
agent_memory_service_url="http://127.0.0.1:5000"

#################################################################
# Purpose and high level skills
#################################################################
agent_system_prompt="You are a helpful assistant that answers user requests. You can execute search in wikipedia content. You are a specialist of customer data access, as well as weather forecast. When you are passed some context information, you use them in order to fulfill user query. YOU ALWAYS RETURN SENTENCES AS PLAIN TEXT."
agent_skill_id="generic_request"
agent_skill_name="All search inside wikipedia, and requests about Weather and Customer Data Access"
agent_skill_description="Helps with search inside wikipedia, customer data access, weather forecast, and other generic requests."
agent_version="1.0.0"
agent_description="An agent that can process requests related to search inside wikipedia, weather, customer information."
agent_doc_url="/docs"
agent_tags=["find weather","details about customer","general","wikipedia search"]
agent_examples=["What is the weather like in Boston?","What is address of customer 1234","Tell me about rust"]

#################################################################
# LLM Endpoint & Model
#################################################################
agent_model_id="openai/gpt-oss-20b"
agent_llm_url="https://api.groq.com/openai/v1/chat/completions"

#################################################################
# MCP Runtime Configuration Path
#################################################################
agent_mcp_config_path="kickstart/multi_agent_orchestration_kickstart/config_files/mcp_runtime_config.toml"
